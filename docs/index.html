<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление текстом | Транслятор и загрузка</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Заголовок большими буквами в левом верхнем углу -->
        <h1 class="header-title">Управление контентом</h1>

        <!-- 4 кнопки: Load File, Load Archive, Translate, Download -->
        <div class="buttons-row">
            <button class="btn" id="loadFileBtn">Load File</button>
            <button class="btn" id="loadArchiveBtn">Load Archive</button>
            <button class="btn btn-translate" id="translateBtn">Translate</button>
            <button class="btn" id="downloadBtn">Download</button>
        </div>

        <!-- Две большие ячейки для текста (безразмерные, расширяются вниз) -->
        <div class="panels">
            <!-- Левая ячейка (источник для Translate) -->
            <div class="panel">
                <div class="panel-header">📄 ЛЕВАЯ ОБЛАСТЬ (ИСХОДНЫЙ ТЕКСТ)</div>
                <textarea class="text-box" id="leftText" placeholder="Введите текст сюда...&#10;Затем нажмите Translate (когда поле не пустое)&#10;Текст скопируется в правую область."></textarea>
            </div>

            <!-- Правая ячейка (цель для Translate) -->
            <div class="panel">
                <div class="panel-header">📄 ПРАВАЯ ОБЛАСТЬ (РЕЗУЛЬТАТ)</div>
                <textarea class="text-box" id="rightText" placeholder="Сюда будет скопирован текст после нажатия Translate...&#10;Также сюда можно писать вручную."></textarea>
            </div>
        </div>
    </div>

    <!-- Всплывающее уведомление "в процессе" (красный фон) -->
    <div id="progressToast" class="progress-toast">⚠️ sorry, this part is in progress yet</div>

    <!-- Модальное окно для ввода имени файла .cpp -->
    <div id="filenameModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">💾 Сохранить как .cpp</span>
                <button class="modal-close" id="closeModalBtn">&times;</button>
            </div>
            <div class="modal-body">
                <label for="filenameInput">Введите имя файла (без расширения):</label>
                <input type="text" id="filenameInput" class="filename-input" placeholder="например: my_program" autocomplete="off">
                <div class="modal-hint">Расширение .cpp добавится автоматически</div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn cancel-btn" id="cancelModalBtn">Отмена</button>
                <button class="modal-btn submit-btn" id="submitFilenameBtn">Скачать .cpp</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
